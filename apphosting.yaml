# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure
specVersion: v1a1
# The following build and run config is for a typical Next.js app.
# You can edit this to fit your specific needs.
build:
  run:
    - npm i
    - npm run build
run:
  # This is the default command for a Next.js app with standalone output.
  command: node .next/standalone/server.js
  # You can customize the CPU and memory of your backend.
  # See https://firebase.google.com/docs/app-hosting/configure#set-instance-size for all options.
  cpu: 1
  memoryMiB: 1024
settings:
  # You can pin your backend to a specific region.
  # See https://firebase.google.com/docs/app-hosting/locations for all options.
  location: us-central1